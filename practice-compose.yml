services:

  # Service 1: A database application
  database:
    container_name: mysql-container
    image: mysql:8.0
    restart: unless-stopped
    networks:
      - chatting-network
    volumes:
      - mysql_db:/var/lib/mysql 
    ports:
      - "3306:3306"
    env_file:
      - ./backend/.env

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Service 2: A backend application
  backend:
    container_name: backend-app
    build:
      context: ./backend
      dockerfile: Dockerfile.multistage
    restart: unless-stopped
    networks:
      - chatting-network
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      database:
        condition: service_healthy

  #  Service 3: A frontend application
  frontend:
    container_name: frontend-app
    build:
      context: ./frontend
      dockerfile: Dockerfile.multistage
      args:
        # Where the browser reaches the backend from. Defaults to localhost:8080
        # for local/single-machine use. Override by setting REACT_APP_API_URL
        # in a .env file next to this docker-compose.yml (or in your shell)
        # before running `docker compose up --build`, e.g. for a real deployment:
        #   REACT_APP_API_URL=https://api.yourdomain.com
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    restart: unless-stopped
    networks:
      - chatting-network
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  chatting-network:
    driver: bridge

volumes:
  mysql_db:
    driver: local


