name: Backend Code Quality and Dependency Check

on:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Maven & Java
        uses: s4u/setup-maven-action@v1.18.0
        with:
          java-version: 21
          java-distribution: temurin
          maven-version: 3.8.7
          # Enables automatic caching of ~/.m2/repository to speed up builds
          cache-enabled: true

      - name: Check Maven Version
        run: mvn -v

      # Scan the raw filesystem before wasting compute on building if major vulnerabilities exist
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "backend"
          severity: "HIGH,CRITICAL"
          exit-code: "0" # Change to "1" if you want to break the build on high/critical bugs

      - name: Maven Build & Verify
        working-directory: ./backend
        run: |
          mvn clean verify -DskipTests
          echo "Successfully compiled and verified the build."
