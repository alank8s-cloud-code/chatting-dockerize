name: Docker CI Frontend and Backend

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/chatting-app-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/chatting-app-frontend

jobs:
  Docker_CI:
    name: Docker CI Pipeline
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. VALIDATE DOCKER COMPOSE
      # --------------------------------------------------
      - name: Validate Docker Compose
        run: docker compose config

      # --------------------------------------------------
      # 3. SETUP DOCKER BUILDX
      # --------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------
      # 4. LOGIN TO DOCKER HUB
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # 5. BUILD BACKEND IMAGE
      # --------------------------------------------------
      - name: Build backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.multistage
          load: true
          push: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # --------------------------------------------------
      # 6. BUILD FRONTEND IMAGE
      # --------------------------------------------------
      - name: Build frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.multistage
          load: true
          push: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # --------------------------------------------------
      # 7. SCAN BACKEND IMAGE
      # --------------------------------------------------
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --------------------------------------------------
      # 8. SCAN FRONTEND IMAGE
      # --------------------------------------------------
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --------------------------------------------------
      # 9. PUSH BACKEND IMAGE
      # --------------------------------------------------
      - name: Push backend image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.multistage
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # --------------------------------------------------
      # 10. PUSH FRONTEND IMAGE
      # --------------------------------------------------
      - name: Push frontend image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.multistage
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
