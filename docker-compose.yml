services:
  database:
    container_name: mysql-container
    image: mysql:8.0
    restart: unless-stopped
    networks:
      - chatting-network
    volumes:
      - mysql_db:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    container_name: backend-app
    image: ${DOCKERHUB_USERNAME}/chattingo-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.multistage
    restart: unless-stopped
    networks:
      - chatting-network
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: frontend-app
    image: ${DOCKERHUB_USERNAME}/chattingo-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.multistage
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    restart: unless-stopped
    networks:
      - chatting-network
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  chatting-network:
    driver: bridge

volumes:
  mysql_db:
    driver: local
